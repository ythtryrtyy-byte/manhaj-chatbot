<style>

:root[data-theme=dark]{--bg:#12171b;--card:#1c242b;--tx:#e8edf2;--mut:#93a0ad;--pri:#3fb59a;--pri2:#1f8c76;--bd:#2c3741;--me:#1a3a33;--ok:#3fb59a;--no:#e0685a;--sh:0 2px 10px rgba(0,0,0,.3)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171b;--card:#1c242b;--tx:#e8edf2;--mut:#93a0ad;--pri:#3fb59a;--pri2:#1f8c76;--bd:#2c3741;--me:#1a3a33;--ok:#3fb59a;--no:#e0685a;--sh:0 2px 10px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
aside{width:290px;flex-shrink:0;background:var(--card);border-inline-end:1px solid var(--bd);overflow-y:auto;padding:12px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.ht{flex:1;min-width:0}h1{font-size:18px;margin:0}.sub{font-size:12px;opacity:.85;margin-top:2px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){border-color:var(--pri);transform:translateY(-1px)}button:disabled{cursor:default}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.ic{background:rgba(255,255,255,.18);border-color:transparent;color:#fff;padding:6px 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:min(820px,94%);padding:11px 15px;border-radius:16px;border:1px solid var(--bd);background:var(--card);line-height:1.85;overflow-wrap:anywhere;box-shadow:var(--sh);animation:in .25s}
.m.u{align-self:flex-start;background:var(--me);border-radius:16px 16px 16px 4px}.m.a{align-self:flex-end;border-inline-start:4px solid var(--pri2)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.m p{margin:.4em 0}.m h4{margin:.9em 0 .3em;color:var(--pri)}.m ul,.m ol{margin:.3em 0;padding-inline-start:1.4em}
.src{font-size:13px;color:var(--pri);font-weight:600;margin-bottom:4px}.note{font-size:12px;color:var(--mut)}
.tw{overflow-x:auto}table{border-collapse:collapse}th,td{border:1px solid var(--bd);padding:6px 10px;text-align:right}th{background:var(--me)}
.cp{font-size:12px;margin:6px 6px 0 0;padding:3px 9px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-end;max-width:min(820px,94%)}
.chips button{border-radius:999px;font-size:14px;padding:6px 13px;background:var(--me)}
.opts{display:flex;flex-direction:column;gap:6px;margin:6px 0}.opt{text-align:right}
.opt.good{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:var(--no);color:#fff;border-color:var(--no)}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--pri);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.2}}
.hero{background:linear-gradient(135deg,var(--me),var(--card));border-color:var(--pri2);width:min(820px,94%)}
.hg{font-size:20px;font-weight:700;color:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:12px;text-align:center;padding:8px 2px;font-size:12px;color:var(--mut)}.stats b{display:block;font-size:20px;color:var(--pri)}
.daily{background:var(--card);border:1px dashed var(--pri2);border-radius:12px;padding:10px;margin-top:8px}.daily span{font-weight:600;color:var(--pri)}
.nm{display:flex;gap:6px;margin-top:10px}
#sg{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 6px}#sg:empty{display:none}#sg button{font-size:13px;border-radius:999px;background:var(--me);padding:4px 11px}
form{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--bd);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
input{flex:1;font:inherit;border:1px solid var(--bd);border-radius:12px;padding:10px 14px;background:var(--bg);color:var(--tx);min-width:0}
details{margin-bottom:6px}summary{cursor:pointer;font-weight:700;padding:7px 2px;color:var(--pri)}summary small{color:var(--mut);font-weight:400}
.sb button{display:block;width:100%;text-align:right;border:0;background:none;padding:6px 8px;border-radius:8px;font-size:14px}.sb button:hover{background:var(--me);transform:none}
.sb .gl button{display:inline-block;width:auto;border:1px solid var(--bd);margin:2px;font-size:13px}
#ov{display:none}#mn{display:none}
@media(max-width:800px){#mn{display:inline-block}aside{position:fixed;top:0;bottom:0;right:0;width:84%;max-width:330px;transform:translateX(100%);transition:.25s;z-index:20}aside.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.4)}#ov.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}.stats{grid-template-columns:repeat(2,1fr)}}

<script>
const DEFAULT_KB="## المقدمة\n\nتُعد المناهج الدراسية حجر الزاوية في المنظومة التعليمية والتربوية؛ فهي ليست مجرد كتب دراسية يُطلب من المتعلمين حفظها، بل مخطط تربوي يترجم فلسفة المجتمع وأهدافه ورؤيته إلى خبرات تعليمية داخل المؤسسات التعليمية وخارجها.\n\nومع اتساع المعرفة وتطور نظريات التعلم والتحولات التكنولوجية والاجتماعية والعلمية، أصبح المنهج منظومة متكاملة من الخبرات المخططة التي تهدف إلى بناء شخصية المتعلم وتحقيق نموه العقلي والوجداني والمهاري والاجتماعي.\n\n---\n\n## الفصل الأول: مفهوم المناهج الدراسية وتطورها التاريخي\n\n### 1. المعنى اللغوي والاصطلاحي للمنهج\n\n**المعنى اللغوي:** ترجع كلمة «منهج» إلى المادة اللغوية (ن هـ ج)، ويقال «نهج الطريق» أي سلكه واتضح، والمنهج هو الطريق الواضح.\n\n**المعنى الاصطلاحي:** تطورت تعريفات المنهج وفقًا للفلسفات التربوية والرؤى العلمية، ويمكن التمييز بين اتجاهين رئيسيين:\n\n1. الاتجاه التقليدي: المنهج القائم على المادة الدراسية.\n2. الاتجاه الحديث: المنهج القائم على الخبرة الشاملة والمتكاملة.\n\n### 2. مفهوم المنهج التقليدي\n\nالمنهج التقليدي هو مجموع المعارف والمواد الدراسية التي يتولى المعلم تلقينها للطالب، مع التركيز على التحصيل العقلي والحفظ، وإهمال بعض الأنشطة والمهارات.\n\n### 3. مفهوم المنهج الحديث\n\nالمنهج الحديث هو جميع الخبرات المرئية والضمنية، الصفية واللاصفية، التي توفرها المؤسسة التعليمية للمتعلمين تحت إشرافها، بهدف تعديل سلوكهم وتحقيق نموهم الشامل.\n\nويؤكد المفهوم الحديث أهمية:\n\n- توجيه الخبرات المنتقاة التي تقدم للطلاب.\n- التخطيط لتعلم الطلاب.\n- الاهتمام بنواتج التعلم.\n- اختيار الأساليب المناسبة لتحقيق الأهداف التربوية والسلوكية.\n\n### 4. أهمية دراسة المناهج بالنسبة للمعلم\n\n1. فهم أن المنهج أوسع من الكتاب المدرسي، ويشمل الخبرات التي يشرف عليها المعلم.\n2. تنمية التفكير والبحث الاستكشافي بدلًا من الاقتصار على الحفظ والتكرار.\n3. صياغة الأهداف السلوكية في المجالات المعرفية والوجدانية والمهارية.\n4. اختيار طرق التدريس الملائمة للمحتوى ومستويات الطلاب.\n5. استخدام التقويم البنائي والختامي للتحقق من تحقيق الأهداف.\n6. تشخيص احتياجات الطلاب وتقديم التغذية الراجعة وتعديل المسار التعليمي.\n\n### 5. أهمية المناهج بالنسبة للمتعلم\n\n1. تنمية المعارف والقيم والأخلاق والمهارات العملية والجسدية.\n2. توفير أنشطة متنوعة تناسب قدرات الطلاب واحتياجاتهم.\n3. تنمية التفكير النقدي وحل المشكلات والتواصل والتعامل مع التكنولوجيا والعمل الجماعي.\n4. ربط المعرفة بالحياة اليومية والمهن المستقبلية.\n\n### 6. أهمية المناهج بالنسبة للمجتمع\n\n1. ترسيخ الهوية ونقل الثقافة والقيم بين الأجيال.\n2. دعم التنمية المستدامة ومواكبة احتياجات سوق العمل.\n3. توجيه المحتوى لمعالجة قضايا المجتمع مثل الصحة والبيئة والمواطنة وحقوق الإنسان.\n\n### 7. التنظيم الهيكلي للمنهج التقليدي\n\n- **المادة الدراسية:** محور العملية التعليمية.\n- **المعلم:** المصدر الرئيسي للمعرفة، ويركز دوره على الشرح والتلقين والتسميع.\n- **الطالب:** متلقٍ للمعلومات، وينحصر دوره غالبًا في الحفظ والاستظهار.\n- **التقويم:** يعتمد على الاختبارات التحريرية أو الشفهية لقياس قدرة الطالب على استرجاع المعلومات.\n\n### 8. نقد المنهج التقليدي\n\n1. إهمال جوانب النمو الوجداني والنفسي والمهاري والاجتماعي والجسمي.\n2. عزل المدرسة عن المجتمع ومشكلاته الواقعية.\n3. عدم مراعاة الفروق الفردية في الاستعدادات والميول والقدرات.\n4. تقليل دور الطالب في الاستكشاف والنقد وحل المشكلات.\n5. تفكيك المعرفة بسبب الفصل التام بين المواد الدراسية.\n\n### 9. العوامل التي أدت إلى تطور مفهوم المنهج\n\n1. **علم النفس التربوي وعلم نفس النمو:** أكدت الدراسات أن المتعلم نشط، وأن نموه متكامل.\n2. **التطور التكنولوجي والانفجار المعرفي:** عززا الانتقال من تلقين المعلومات إلى تعليم مهارات الوصول إلى المعرفة والتعلم الذاتي.\n3. **الفلسفة التقدمية:** ارتبطت بجون ديوي وركزت على الخبرة العملية والتعلم بالممارسة والربط بين المدرسة والمجتمع.\n4. **تغير احتياجات سوق العمل:** أدى إلى زيادة الاهتمام بالتفكير النقدي وحل المشكلات والتواصل والتكنولوجيا.\n\n### 10. مبادئ المنهج الحديث\n\n- المنهج ليس مجرد مجموعة من المواد الدراسية.\n- المنهج ديناميكي ومرن وقابل للتطوير.\n- ينبغي مراجعة المناهج وفقًا لاحتياجات المجتمع والتغيرات.\n- يشمل المنهج الخبرات التي تهيئها المدرسة ويشارك فيها المتعلم تحت إشرافها.\n- يهدف إلى تحقيق النمو الشامل وتعديل السلوك.\n- يجب أن ترتبط الأهداف بالمحتوى والتدريس والأنشطة والتقويم.\n\n### 11. خصائص المنهج الحديث\n\n- التركيز على المتعلم.\n- مراعاة الفروق الفردية.\n- ربط التعلم بالحياة والمجتمع.\n- تنمية مهارات التفكير والاستقصاء وحل المشكلات.\n- تنويع طرق التدريس والأنشطة والوسائل.\n- استخدام التقويم المستمر والتغذية الراجعة.\n- قابلية التطوير والتحديث.\n\n### 12. مقارنة بين المنهج التقليدي والحديث\n\n| وجه المقارنة | المنهج التقليدي | المنهج الحديث |\n|---|---|---|\n| محور الاهتمام | المادة الدراسية | المتعلم والخبرات |\n| دور المعلم | ناقل للمعلومات | ميسر وموجه |\n| دور المتعلم | متلقٍ وحافظ | مشارك وباحث |\n| التدريس | التلقين والاستظهار | النشاط والفهم والتطبيق |\n| المحتوى | مواد منفصلة غالبًا | خبرات أكثر ترابطًا |\n| التقويم | اختبارات تقيس التذكر غالبًا | تقويم متنوع ومستمر |\n| العلاقة بالمجتمع | محدودة | ربط بالواقع والمشكلات |\n\n### 13. أنواع المنهج من حيث ظهوره\n\n**المنهج الرسمي أو الصريح:** المعارف والمهارات والقيم المخطط لها والمعلنة في الوثائق والمواد والأنشطة.\n\n**المنهج الخفي أو الضمني:** القيم والاتجاهات التي يكتسبها الطالب من ثقافة المدرسة وسلوك المعلمين والعلاقات والقواعد، حتى إن لم تُذكر رسميًا.\n\n**المنهج الصفري:** المعارف أو الخبرات التي لا يتضمنها المنهج أو يتم استبعادها.\n\n### 14. الاتجاهات المعاصرة\n\nتشمل الاتجاهات المعاصرة توظيف التعلم الرقمي والتفاعلي، وتوفير مصادر متعددة للمعرفة، وتكييف الخبرات وفق احتياجات المتعلم، مع استمرار دور المعلم في التوجيه والمتابعة.\n\n---\n\n## الفصل الثاني: عناصر المنهج الدراسي\n\n### 1. الأهداف التعليمية\n\nالأهداف التعليمية هي النتائج التي يُتوقع أن يحققها المتعلم نتيجة مروره بالخبرات التعليمية. وهي توجه اختيار المحتوى وطرق التدريس والأنشطة وأساليب التقويم.\n\n#### أهمية الأهداف\n\n- تحديد النتائج التعليمية المرغوبة.\n- توجيه اختيار المحتوى والخبرات.\n- مساعدة المعلم على اختيار الاستراتيجيات المناسبة.\n- تحديد أساس للحكم على نجاح التعلم.\n- توضيح ما هو متوقع من المتعلم.\n\n#### مصادر الأهداف\n\nتستمد الأهداف من:\n\n- فلسفة المجتمع وقيمه.\n- احتياجات المتعلمين وخصائص نموهم.\n- طبيعة المعرفة والمواد الدراسية.\n- احتياجات المجتمع وسوق العمل.\n- التطورات العلمية والتكنولوجية.\n\n#### مستويات الأهداف\n\n1. **الأهداف العامة:** أهداف واسعة وطويلة المدى تعبّر عن الغايات الكبرى للتعليم.\n2. **الأهداف الخاصة:** ترتبط بمادة أو مرحلة أو وحدة تعليمية.\n3. **الأهداف السلوكية أو الإجرائية:** تصف أداءً متوقعًا يمكن ملاحظته وقياسه.\n\n#### مجالات الأهداف\n\n1. **المجال المعرفي:** يتعلق بالمعرفة والفهم والتطبيق والتحليل والتقويم والإبداع.\n2. **المجال الوجداني:** يتعلق بالقيم والاتجاهات والميول والتقدير.\n3. **المجال المهاري أو النفس حركي:** يتعلق بأداء المهارات العملية والحركية.\n\n#### شروط صياغة الهدف السلوكي\n\n- أن يكون واضحًا ومحددًا.\n- أن يركز على أداء المتعلم.\n- أن يكون قابلًا للملاحظة أو القياس.\n- أن يناسب مستوى المتعلم.\n- أن يوضح مستوى الأداء المطلوب عند الحاجة.\n\nمثال توضيحي: «أن يفسر المتعلم مفهومًا محددًا باستخدام مثال صحيح».\n\n### 2. المحتوى التعليمي\n\nالمحتوى هو المعارف والمفاهيم والمبادئ والمهارات والقيم التي يتم اختيارها لتحقيق الأهداف التعليمية.\n\n#### أشكال المحتوى\n\n- **الحقائق:** معلومات محددة يمكن التحقق منها.\n- **المفاهيم:** أفكار عامة تجمع أمثلة ووقائع متشابهة.\n- **المبادئ والتعميمات:** علاقات أو قواعد تربط مفاهيم متعددة.\n- **النظريات والقوانين:** أطر تفسيرية أو علاقات منظمة للظواهر.\n- **المهارات:** أداءات معرفية أو عملية يمكن تعلمها وتطويرها.\n- **القيم والاتجاهات:** معايير ومواقف تساعد في توجيه السلوك.\n\n#### معايير اختيار المحتوى\n\n1. الارتباط بالأهداف.\n2. الدقة والصدق العلمي.\n3. الملاءمة لمستوى المتعلم.\n4. الأهمية والفائدة.\n5. مراعاة ثقافة المجتمع واحتياجاته.\n6. التوازن بين العمق والاتساع.\n7. إمكانية التعلم والتطبيق.\n8. قابلية التحديث عند تغير المعرفة.\n\n#### تنظيم المحتوى\n\nيمكن تنظيم المحتوى:\n\n- من البسيط إلى المركب.\n- من المعلوم إلى المجهول.\n- من المحسوس إلى المجرد.\n- من القريب إلى البعيد.\n- وفق التسلسل والتكامل والترابط.\n- بطريقة حلزونية تعيد المفاهيم تدريجيًا بعمق أكبر.\n\n### 3. طرق التدريس واستراتيجيات التعلم\n\nتحدد طرق التدريس كيفية تقديم المحتوى ومشاركة المتعلم في تحقيق الأهداف. ويعتمد اختيار الطريقة على الأهداف وطبيعة المحتوى وخصائص الطلاب والإمكانات المتاحة.\n\nمن الاستراتيجيات المستخدمة:\n\n- الشرح والحوار والمناقشة.\n- التعلم التعاوني.\n- حل المشكلات.\n- التعلم القائم على المشروعات.\n- الاستقصاء والاكتشاف.\n- التعلم العملي والتجريبي.\n- التعلم المدمج والرقمي.\n\nلا توجد طريقة واحدة مناسبة لكل المواقف التعليمية، لذلك يُفضل تنويع الطرق وفقًا للهدف والمحتوى واحتياجات المتعلمين.\n\n### 4. الأنشطة التعليمية\n\nالأنشطة خبرات يشارك فيها المتعلم لتطبيق المعرفة وتنمية المهارات والاتجاهات. وقد تكون:\n\n- صفية أو لا صفية.\n- فردية أو جماعية.\n- نظرية أو عملية.\n\nينبغي أن ترتبط الأنشطة بالأهداف، وتناسب قدرات الطلاب، وتتيح المشاركة والتعاون والتفكير والتطبيق.\n\n### 5. الوسائل والمصادر التعليمية\n\nتشمل الكتب والرسوم والنماذج والأدوات والتجارب والعروض والموارد الرقمية والمنصات التعليمية.\n\nيُختار المورد التعليمي وفقًا للهدف، وخصائص المتعلمين، ودقته، وسهولة استخدامه، ومدى إتاحته.\n\n### 6. التقويم\n\nالتقويم عملية منظمة لجمع الأدلة وتحليلها والحكم على تقدم المتعلم وفاعلية المنهج، ثم استخدام النتائج في تحسين التعليم.\n\n#### أنواع التقويم\n\n**التقويم القبلي أو التشخيصي:** يُستخدم قبل التعلم لتحديد المعارف السابقة والاستعدادات والصعوبات.\n\n**التقويم البنائي أو التكويني:** يُستخدم أثناء التعلم لتقديم تغذية راجعة وتعديل التدريس أولًا بأول.\n\n**التقويم الختامي أو التجميعي:** يُستخدم في نهاية وحدة أو فصل أو برنامج للحكم على مدى تحقق الأهداف.\n\n**التقويم التتبعي:** يتابع أثر التعلم بعد فترة، ومدى قدرة المتعلم على تطبيق ما تعلمه في الحياة العملية.\n\n#### أدوات التقويم\n\n- الاختبارات التحريرية والشفهية.\n- المناقشات الصفية.\n- الواجبات القصيرة.\n- بطاقات الملاحظة.\n- المشروعات والمهام الأدائية.\n- ملفات الإنجاز.\n- المقابلات والاستبانات ودراسات المتابعة.\n\n#### التقويم البديل والواقعي\n\nيهدف إلى قياس قدرة المتعلم على تطبيق المعارف والمهارات في مواقف حقيقية أو قريبة من الحياة الواقعية.\n\nمن أدواته:\n\n1. **ملفات الإنجاز:** تجمع أعمال الطالب وتوضح نموه وتطوره عبر الزمن.\n2. **قواعد التقدير:** توضح معايير الأداء ومستوياته.\n3. **سجلات الملاحظة:** تسجل أداء المتعلم في المواقف التعليمية.\n4. **التقويم الذاتي وتقويم الأقران:** يشرك المتعلم في تقييم أدائه وأداء زملائه.\n\n### 7. العلاقة بين عناصر المنهج والتغذية الراجعة\n\nتعمل عناصر المنهج في منظومة مترابطة:\n\n- تحدد الأهداف طبيعة المحتوى.\n- توجه الأهداف والمحتوى اختيار الاستراتيجيات والأنشطة.\n- يكشف التقويم مدى تحقق الأهداف وفاعلية التدريس.\n- تُستخدم التغذية الراجعة لتعديل الأهداف أو المحتوى أو الاستراتيجيات عند الحاجة.\n\n---\n\n## الفصل الثالث: أسس بناء المناهج الدراسية\n\n### 1. مفهوم أسس بناء المنهج\n\nأسس بناء المناهج هي القواعد والأركان التي يستند إليها مصممو المناهج عند التخطيط لأي منهج أو تطويره. ويتطلب بناء المنهج التفاعل بين فلسفة المجتمع وطبيعة المتعلم وخصائص نموه وطبيعة المعرفة والأسس التكنولوجية الحديثة.\n\nوتشمل الأسس الرئيسية:\n\n1. الأساس الفلسفي.\n2. الأساس النفسي.\n3. الأساس الاجتماعي والثقافي.\n4. الأساس المعرفي.\n5. الأساس التكنولوجي والرقمي.\n\n### 2. الأساس الفلسفي\n\nهو الإطار الفكري والتطبيقي الذي يحدد الغايات الكبرى للعملية التربوية. ويعكس المنهج الفلسفة السائدة في المجتمع وقيمه وعقيدته.\n\n#### الفلسفة المثالية\n\n- تعلي من شأن العقل والأفكار.\n- قد تؤثر في الاهتمام بالمواد النظرية والتراث الثقافي وتدريب العقل.\n\n#### الفلسفة الواقعية\n\n- ترى أن الحقيقة ترتبط بالعالم المادي والظواهر الطبيعية.\n- تؤثر في الاهتمام بالعلوم الطبيعية والتجريب والملاحظة والحقائق القابلة للقياس.\n\n#### الفلسفة التقدمية أو البراجماتية\n\n- تؤكد أهمية التجربة والخبرة المباشرة.\n- تجعل المتعلم محور العملية التعليمية.\n- تهتم بحل المشكلات والأنشطة العملية والربط بالواقع.\n\n#### وظائف الأساس الفلسفي\n\n- تحديد الأهداف العامة للتعليم.\n- المساعدة في اختيار المحتوى والخبرات.\n- توجيه طرق التدريس والتقويم.\n- تحديد القيم والمعايير التي يعبّر عنها المنهج.\n\n#### الفلسفة التربوية في المجتمع العربي والإسلامي\n\nتراعي:\n\n- الهوية العربية والإسلامية.\n- التوازن بين الروح والعقل والبدن.\n- قيم التسامح والمسؤولية الاجتماعية والمواطنة.\n- الجمع بين القيم الثابتة ومواكبة العلم والتطور الحضاري.\n\n### 3. الأساس النفسي\n\nيتعلق بطبيعة المتعلم وخصائص نموه وميوله وحاجاته وقدراته ونظريات التعلم التي توضح كيف يتعلم الإنسان.\n\n#### مراعاة خصائص النمو والفروق الفردية\n\n- تقديم خبرات تناسب المرحلة العمرية والنمائية.\n- مراعاة تكامل النمو العقلي والوجداني والحركي والاجتماعي.\n- تنويع الأنشطة والوسائل لتناسب اختلاف المتعلمين.\n- تقديم أنشطة إثرائية للمتقدمين ودعم علاجي لمن يواجهون صعوبات.\n\n#### النظرية السلوكية\n\nتركز تطبيقاتها على:\n\n- صياغة أهداف قابلة للقياس.\n- تقسيم المحتوى إلى خطوات صغيرة.\n- التدريب والتكرار.\n- التعزيز الفوري.\n\n#### النظرية المعرفية\n\nتركز تطبيقاتها على:\n\n- كيفية معالجة المعلومات.\n- تنظيم المحتوى بما يتناسب مع البنية المعرفية للمتعلم.\n- الانتقال من البسيط إلى المركب.\n- الفهم والخرائط الذهنية والتفكير المنطقي.\n\n#### النظرية البنائية\n\nتركز تطبيقاتها على:\n\n- بناء المتعلم معرفته انطلاقًا من خبراته السابقة.\n- التعلم القائم على المشكلات.\n- البحث الاستكشافي.\n- التعلم التشاركي.\n- ربط المعرفة الجديدة بالمعرفة السابقة.\n\n| النظرية | دور المنهج | دور المتعلم |\n|---|---|---|\n| السلوكية | تقديم تدريبات وتعزيز السلوك | يستجيب ويطبق |\n| المعرفية | تنظيم المعلومات وتسهيل معالجتها | يعالج المعلومات ويحللها |\n| البنائية | توفير المشكلات والخبرات الاستكشافية | يبني المعرفة بنفسه |\n\n### 4. الأساس الاجتماعي والثقافي\n\nيصمم المنهج لخدمة المجتمع وتلبية احتياجاته، ويتأثر بالتراث الثقافي والقيم والتقاليد والمشكلات الحالية والمستقبلية.\n\n#### عناصر الثقافة\n\n- **عموميات الثقافة:** اللغة والقيم والمعارف والعادات التي يشترك فيها معظم أفراد المجتمع، وتدعم التماسك والوحدة الاجتماعية.\n- **خصوصيات الثقافة:** المعارف والمهارات التخصصية التي ترتبط بفئات أو مهن معينة.\n\n#### أهمية الأساس الاجتماعي\n\n- نقل الثقافة والقيم بين الأجيال.\n- إعداد المتعلم للمشاركة في المجتمع.\n- ربط المحتوى بالمشكلات والاحتياجات الواقعية.\n- الاستجابة للتحولات الاجتماعية والمهنية.\n\n### 5. الأساس المعرفي\n\nيراعي طبيعة المعرفة والبنية الهيكلية للعلوم والعلاقات بينها. ومع الانفجار المعرفي، ينبغي اختيار المعارف الأساسية وتنظيمها وتنمية مهارات الوصول إلى المعلومات والتحقق منها واستخدامها.\n\nومن المبادئ المهمة:\n\n- الدقة العلمية.\n- التسلسل المنطقي.\n- الترابط بين المفاهيم.\n- التوازن بين العمق والاتساع.\n- ربط المعرفة بالتطبيق عندما يكون ذلك مناسبًا.\n\n### 6. الأساس التكنولوجي والرقمي\n\nيهتم بتوظيف التقنيات والمستحدثات الرقمية في تصميم المناهج وتنفيذها وتقويمها.\n\nمن أمثلته:\n\n- المنصات التعليمية.\n- الموارد الرقمية.\n- التعلم المدمج والتعليم عن بعد.\n- المحاكاة والوسائط التفاعلية.\n- أدوات التواصل والتعاون الرقمي.\n\nيجب أن يخدم استخدام التقنية الأهداف التعليمية، مع مراعاة الإتاحة والخصوصية والسلامة الرقمية وتفاوت الإمكانات.\n\n---\n\n## الفصل الرابع: أنواع المناهج الدراسية\n\nيمكن تصنيف المناهج بحسب محور التنظيم والاهتمام الرئيسي.\n\n### 1. المناهج المتمحورة حول المادة الدراسية\n\n#### أ. منهج المواد المنفصلة\n\nينظم المعرفة في مواد مستقلة، مثل التاريخ والجغرافيا والعلوم.\n\n**مميزاته:** وضوح المواد والتخصص والتسلسل.\n\n**محدوديته:** قد يؤدي إلى تجزئة المعرفة وضعف الربط بين المواد.\n\n#### ب. منهج المواد المترابطة\n\nيحافظ على المواد الدراسية، مع إنشاء روابط بينها، مثل الربط بين التاريخ والجغرافيا أو الرياضيات والعلوم.\n\nيساعد هذا التنظيم المتعلم على إدراك العلاقات بين المواد دون إلغاء التخصصات.\n\n#### ج. منهج المجالات الواسعة\n\nيجمع مواد متقاربة في مجال واحد أوسع بهدف تقليل التجزئة وتقديم رؤية أكثر تكاملًا.\n\n### 2. المناهج المتمحورة حول المتعلم\n\n#### أ. منهج النشاط\n\nينطلق من ميول المتعلم واهتماماته ويعتمد على المشاركة والخبرة والعمل، مع توجيه النشاط نحو الأهداف التربوية.\n\n#### ب. منهج الوحدات\n\nينظم التعلم حول موضوع أو مشكلة أو خبرة متكاملة، ويجمع معارف وأنشطة من مجالات مختلفة حول محور مشترك.\n\n#### ج. المنهج المتمركز حول المتعلم\n\nيراعي حاجات المتعلم واستعداداته وفروقاته الفردية، ويتيح المشاركة والاختيار والتعلم النشط ضمن أهداف واضحة.\n\n### 3. المناهج المتمحورة حول المجتمع\n\n#### أ. منهج النواة أو المواد المشتركة\n\nيركز على المعارف والخبرات الأساسية المشتركة التي يحتاج إليها جميع المتعلمين.\n\n#### ب. منهج المشكلات الاجتماعية\n\nينظم التعلم حول مشكلات وقضايا من واقع المجتمع، ويشجع البحث والتحليل والتعاون واقتراح الحلول.\n\n### 4. اتجاهات وتنظيمات معاصرة\n\n**المنهج التكنولوجي:** يوظف الأدوات والموارد الرقمية في التعليم.\n\n**المنهج الحلزوني:** يعيد تقديم المفاهيم الأساسية في مراحل متتابعة، مع زيادة العمق والتعقيد تدريجيًا.\n\n**المنهج الخفي:** ما يكتسبه المتعلم ضمنيًا من ثقافة المؤسسة وعلاقاتها وقواعدها.\n\n**المنهج المرن أو المتكيف:** يتيح تعديلات في الأنشطة والموارد والمسارات لتناسب احتياجات المتعلمين مع الحفاظ على الأهداف الأساسية.\n\n### 5. اختيار نوع المنهج\n\nيعتمد اختيار نوع المنهج على:\n\n- الأهداف التعليمية.\n- طبيعة المعرفة.\n- خصائص المتعلمين.\n- احتياجات المجتمع.\n- الوقت المتاح.\n- الموارد والإمكانات.\n\nوقد يجمع المنهج بين أكثر من نوع لتحقيق التكامل.\n\n---\n\n## الفصل الخامس: تطوير المناهج الدراسية\n\n### 1. مفهوم تطوير المناهج\n\nتطوير المنهج عملية منظمة ومستمرة لفحص المنهج وتحسين أهدافه ومحتواه وخبراته وطرائق تدريسه وتقويمه، استجابة للتغيرات المعرفية والتكنولوجية والاجتماعية واحتياجات المتعلمين.\n\n#### الفرق بين التغيير والتحسين والتطوير\n\n- **التغيير:** إجراء تعديل قد يكون محدودًا أو واسعًا.\n- **التحسين:** رفع جودة جانب أو أكثر من جوانب المنهج.\n- **التطوير:** عملية أشمل ومخططة تبدأ بدراسة الوضع الحالي وتحديد الاحتياجات وتنفيذ التعديلات وتقويم آثارها.\n\n### 2. دوافع تطوير المناهج\n\n- الانفجار المعرفي والتقدم العلمي.\n- التطور التكنولوجي والرقمي.\n- تغير احتياجات المجتمع وسوق العمل.\n- نتائج التقويم وتحديد نقاط القوة والضعف.\n- تغير خصائص المتعلمين واحتياجاتهم.\n- الحاجة إلى تنمية التفكير وحل المشكلات والتعلم المستمر.\n\n### 3. مراحل تطوير المنهج\n\n1. **دراسة الواقع وتشخيص الاحتياجات:** تحليل المنهج الحالي ونتائج المتعلمين واحتياجات المجتمع.\n2. **تحديد الأهداف:** صياغة النتائج المرغوبة وفق الأولويات.\n3. **اختيار المحتوى والخبرات:** تحديد المعارف والمهارات وتنظيمها.\n4. **اختيار طرائق التدريس والأنشطة والوسائل:** مواءمتها مع الأهداف والمحتوى.\n5. **التجريب أو التطبيق الأولي:** اختبار المنهج في ظروف محددة عند الإمكان.\n6. **التقويم وجمع التغذية الراجعة:** تحليل النتائج وآراء المعلمين والمتعلمين.\n7. **التعديل والتنفيذ والتدريب:** تحسين المنهج وتوفير الدعم اللازم.\n8. **المتابعة المستمرة:** التحقق من أثر التطوير واستدامته.\n\n### 4. نموذج تايلر\n\nيرتكز نموذج تايلر على أربعة أسئلة أساسية:\n\n1. ما الأهداف التعليمية التي ينبغي تحقيقها؟\n2. ما الخبرات التعليمية التي تساعد على تحقيق هذه الأهداف؟\n3. كيف يمكن تنظيم الخبرات التعليمية بفاعلية؟\n4. كيف يمكن تحديد ما إذا كانت الأهداف قد تحققت؟\n\n### 5. نموذج هيلدا تابا\n\nيؤكد نموذج هيلدا تابا دور المعلم والخبرة الميدانية، ويتدرج في العادة عبر:\n\n1. تشخيص الاحتياجات.\n2. صياغة الأهداف.\n3. اختيار المحتوى وتنظيمه.\n4. اختيار الخبرات التعليمية وتنظيمها.\n5. تحديد أساليب التقويم.\n\n### 6. استراتيجيات معاصرة لتطوير المناهج\n\n- إشراك المعلمين والمتعلمين والخبراء وأصحاب المصلحة.\n- الاعتماد على البحوث والبيانات ونتائج التقويم.\n- تحديث المحتوى بما يتناسب مع المهارات المطلوبة.\n- إدماج التقنية عندما تضيف قيمة تعليمية.\n- دعم التعلم النشط والمشروعات وحل المشكلات.\n- تطوير التقويم ليقيس الفهم والتطبيق والمهارات، لا الحفظ فقط.\n- تدريب المعلمين ومتابعة تنفيذ المنهج.\n\n### 7. معوقات وتحديات تطوير المناهج\n\n1. **مقاومة التغيير:** رفض بعض المعلمين والإداريين للأساليب الحديثة والميل إلى النمط القديم.\n2. **ضعف برامج التدريب:** عدم تأهيل المعلمين بالشكل الكافي لمواكبة الفلسفات والمهارات الجديدة.\n3. **قصور الإمكانات المادية والتقنية:** مثل ضعف البنية التحتية الرقمية في بعض المدارس.\n4. **انفصال التقويم عن المنهج المطور:** استمرار الاختبارات التقليدية المعتمدة على التذكر، بما يحد من تحقيق أهداف التطوير القائمة على مهارات التفكير العليا.\n\n### 8. شروط تساعد على نجاح التطوير\n\n- وضوح الأهداف وأولويات التطوير.\n- مشاركة المعلمين وتدريبهم.\n- توفير الموارد والبنية التحتية اللازمة.\n- الاتساق بين الأهداف والمحتوى والتدريس والتقويم.\n- جمع الملاحظات والبيانات باستمرار.\n- الاستعداد للتعديل بناءً على الأدلة والنتائج.\n\n---";
